name: Enquiry smoke test

# Diagnostic, run by hand only. It sends exactly the request
# functions/api/enquiry.ts sends to Supabase, from a runner that can reach it,
# and prints the status and body. This container's network policy blocks
# supabase.co, so this workflow is the only way to see what PostgREST actually
# answers for an insert over HTTP rather than through a SQL session.
#
# It writes one obviously-fake row into website_enquiries each time it runs.
# Delete the row afterwards, and delete this workflow once the form is proven.

on:
  workflow_dispatch:

jobs:
  insert:
    name: POST an enquiry the way the Function does
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Insert with Prefer=return=minimal
        env:
          SUPABASE_URL: https://tyustemnubltqpvcfklm.supabase.co
          SUPABASE_KEY: sb_publishable_CNcwLabAS6745iwrS2j-1A_z-BMUXrM
        run: |
          set -uo pipefail

          payload='{"enquiry_type":"home_solar","full_name":"SMOKE TEST - delete me","mobile_number":"9876500002","details":{},"page_path":"/contact"}'

          echo "--- with Prefer: return=minimal (what the Function sends) ---"
          code=$(curl --silent --show-error --max-time 30 \
            --output body.txt --write-out '%{http_code}' \
            --request POST "${SUPABASE_URL}/rest/v1/website_enquiries" \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'Prefer: return=minimal' \
            --data "${payload}") || code=000
          echo "HTTP ${code}"
          echo "Body: $(cat body.txt)"

          echo
          echo "--- without the Authorization header, apikey only ---"
          code2=$(curl --silent --show-error --max-time 30 \
            --output body2.txt --write-out '%{http_code}' \
            --request POST "${SUPABASE_URL}/rest/v1/website_enquiries" \
            --header "apikey: ${SUPABASE_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'Prefer: return=minimal' \
            --data '{"enquiry_type":"home_solar","full_name":"SMOKE TEST 2 - delete me","mobile_number":"9876500003","details":{},"page_path":"/contact"}') || code2=000
          echo "HTTP ${code2}"
          echo "Body: $(cat body2.txt)"

          echo
          echo "201 or 204 means the insert path works over HTTP."
          echo "401/403 means the key is rejected. 42501 means a missing grant."
